<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Topbar'daki zincir logosunun sekme simgesi surumu.
       Sekmede 16x16 piksele kadar kuculdugu icin cizgi kalinligi
       biraz artirildi, yoksa halkalar tek bir leke gibi gorunuyor. -->
  <defs>
    <linearGradient id="favGrad" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1668a8" />
      <stop offset="50%" stop-color="#1fa5b4" />
      <stop offset="100%" stop-color="#35e3bb" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#141828" />
  <rect x="6.5" y="21.5" width="24" height="16" rx="8"
        transform="rotate(-45 18.5 29.5)"
        stroke="url(#favGrad)" stroke-width="5.6" fill="none" stroke-linejoin="round" />
  <rect x="17.5" y="10.5" width="24" height="16" rx="8"
        transform="rotate(-45 29.5 18.5)"
        stroke="url(#favGrad)" stroke-width="5.6" fill="none" stroke-linejoin="round" />
</svg>

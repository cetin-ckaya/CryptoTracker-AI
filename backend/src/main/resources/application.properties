spring.application.name=backend

server.port=8081
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/cryptotracker
spring.datasource.username=postgres
spring.datasource.password=admin

# Flyway - run migrations automatically
spring.flyway.enabled=true

# JPA - show SQL queries in logs (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPA Auditing - required for @CreatedDate and @LastModifiedDate in BaseEntity
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT - secret key (min 32 chars) and token expiration in ms (86400000 = 24h)
jwt.secret=cryptotracker-super-secret-key-minimum-32-chars
jwt.expiration=86400000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Iki nokta sonrasi varsayilan deger: anahtar tanimli degilse bos string.
# Boylece testler ve CI makinesi, gitignore'daki application-local.properties
# olmadan da context'i ayaga kaldirabilir. Gercek deger local profilden gelir.
groq.api.key=${GROQ_API_KEY:}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest